<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO & Title -->
    <title>City Care - Report urban problems in your city</title>
    <meta
      name="description"
      content="City Care lets residents report urban problems such as potholes, flooding, blocked drains and broken streetlights with a photo, and routes every verified report to the authority responsible for it."
    />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.patachako.co.tz/" />

    <!-- Favicons & Apple Touch Icon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/pata-logo-v2.png" />
    <link rel="shortcut icon" href="/pata-logo-v2.png" />
    <link rel="apple-touch-icon" href="/pata-logo-v2.png" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:title" content="City Care - Report urban problems in your city" />
    <meta
      property="og:description"
      content="Photograph a problem in your city and City Care sends the verified report to the authority responsible."
    />
    <meta property="og:url" content="https://www.patachako.co.tz/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.patachako.co.tz/pata-logo-v2.png" />

    <!-- Google Site Name & Organization Structured Data -->
    <script type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "PataChako",
          "alternateName": "PataChako Lost & Found",
          "url": "https://www.patachako.co.tz/"
        },
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "PataChako",
          "url": "https://www.patachako.co.tz/",
          "logo": "https://www.patachako.co.tz/pata-logo-v2.png"
        }
      ]
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
