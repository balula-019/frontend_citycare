<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO & Title -->
    <title>PataChako - Lost & Found</title>
    <meta
      name="description"
      content="PataChako is Tanzania's lost and found platform connecting people who have lost items with verified organisations that have found them."
    />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.patachako.co.tz/" />

    <!-- Favicons & Google Search Logo -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://www.patachako.co.tz/pata-logo.png" />
    <link rel="shortcut icon" href="https://www.patachako.co.tz/pata-logo.png" />
    <link rel="apple-touch-icon" href="https://www.patachako.co.tz/pata-logo.png" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:title" content="PataChako - Lost & Found" />
    <meta
      property="og:description"
      content="Tanzania's lost and found platform connecting people with their lost items."
    />
    <meta property="og:url" content="https://www.patachako.co.tz/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.patachako.co.tz/pata-logo.png" />

    <!-- Google Site Name & Logo Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PataChako",
        "alternateName": "PataChako Lost & Found",
        "url": "https://www.patachako.co.tz/",
        "logo": "https://www.patachako.co.tz/pata-logo.png"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
